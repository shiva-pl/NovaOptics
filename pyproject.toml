[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novaoptics"
version = "0.1.0"
description = "Optical design by morphing ideal phase into glass: differentiable ray tracing with JAX"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]
gui = ["PySide6>=6.6"]

[project.scripts]
novaoptics-gui = "novaoptics.gui.app:main"

[tool.setuptools.packages.find]
include = ["novaoptics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
